<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'"><title>WorkBuddy 模型助手</title><style>
body{font:15px/1.7 'Microsoft YaHei','Segoe UI',sans-serif;background:#f4f6fa;color:#202838;margin:0;padding:60px 28px}main{max-width:660px;margin:auto;background:white;border:1px solid #dde3ec;border-radius:14px;padding:30px}h1{font-size:24px;margin:0 0 12px}p{color:#556074}button,input{font:inherit;border:1px solid #d6dfef;border-radius:7px;padding:9px 14px;background:#f5f8fd;color:#243b62}button{cursor:pointer;margin:5px}button.primary{background:#2f6bff;color:white;border-color:#2f6bff}#message{white-space:pre-wrap;overflow-wrap:anywhere}details{margin-top:20px}input{width:100px}small{color:#6b7789}label{display:block;margin:12px 0}</style></head><body><main><h1>WorkBuddy 模型助手</h1><p id="message">正在启动本机服务…</p><button class="primary" id="start">启动服务</button><button id="import">导入旧代理的配置和账号</button><button id="folder">打开数据目录</button><details><summary>端口被占用，如何处理？</summary><p>先停止旧代理，或更换下面的端口。更换后，聊天客户端也需更新 API 地址。</p><label>新端口 <input id="port" type="number" min="1024" max="65535" value="8788"></label><button id="change">修改端口并启动</button></details><p><small>关闭窗口后应用留在托盘。右键托盘图标选择“退出并停止服务”才会完全退出。</small></p></main><script src="loading.js"></script></body></html>
